model:
  model_path: "/app/models/Qwen2.5-VL-7B-Instruct"

data:
  train_data_path: "/app/datasets/DeepEyes-Datasets-47k/data_0.1.2_visual_toolbox_v2.parquet"
  batch_size: 2
  max_samples: 8
  prompt_key: prompt
  image_key: images
  video_key: videos
  max_prompt_length: 1024
  filter_overlong_prompts: False
  return_raw_chat: True
  cache_dir: "~/.cache/verl/rlhf"

rollout:
  n: 8
  temperature: 1.0
  top_p: 0.9
  top_k: -1
  prompt_length: 1024
  response_length: 512
  dtype: bfloat16
  tensor_model_parallel_size: 1
  gpu_memory_utilization: 0.85
  enforce_eager: True
  free_cache_engine: True
  load_format: dummy_dtensor
  disable_log_stats: True
  enable_chunked_prefill: False
  max_num_batched_tokens: 8192
  agent:
    activate_agent: True
    single_response_max_tokens: 512
    max_turns: 6
    concurrent_workers: 1
    tool_name_key: env_name
    custom_stop: []
    show_tqdm: False
    vl_model_path: ${model.model_path}
  max_vllm_images: 16
  max_vllm_videos: 0

output:
  save_all_path: outputs/rollout_trace_all.json
  save_tool_path: outputs/rollout_trace_tool.json
  save_plain_path: outputs/rollout_trace_plain.json
  only_with_tool: False
